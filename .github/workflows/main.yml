name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g cordova

      - run: |
          mkdir -p www res
          cp index.html www/index.html
          python3 -c "import base64; open('res/icon.png', 'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))"
          cordova platform add android@13.0.0
          cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: StreamApp-Debug-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          
